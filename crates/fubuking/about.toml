# cargo-about settings for THIRD-PARTY-LICENSES, which every release archive
# of the `fubuking` CLI carries (see .github/workflows/release-cli.yml).
# Where a crate offers a choice, the first license listed here is taken:
# MIT ahead of Apache-2.0, which would also bring the crate's NOTICE file.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# FubuKing's own crates, covered by LICENSE and NOTICE.
private = { ignore = true }
