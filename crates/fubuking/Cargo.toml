[package]
name = "fubuking"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "One memory and usage-limit handoff for Claude Code, Codex and any MCP agent"
publish = false

[lib]
name = "fubuking"

[[bin]]
name = "fubuking"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
atlas-agent-transcript = { path = "../atlas-agent-transcript" }
atlas-process = { path = "../atlas-process" }
atlas-shared-memory = { path = "../atlas-shared-memory" }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
dirs = { workspace = true }
dunce = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal"] }
toml = { workspace = true }
which = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# The fake `claude` and `codex` are this test's own binary under those names,
# so it has its own `main` (see tests/handoff/main.rs).
[[test]]
name = "handoff"
path = "tests/handoff/main.rs"
harness = false

# The workspace lint table is only real for members that opt in.
[lints]
workspace = true
