# Modified by FubuKing from upstream Atlas (Apache-2.0).
# Clippy settings for every workspace member: clippy finds this file by walking
# up from each crate's manifest.
#
# * `allow-{expect,unwrap}-in-tests` — a panic in a test IS the failure report.
#   Matches the reasoning recorded in the root `[workspace.lints.clippy]` table
#   for why `unwrap_used`/`expect_used` are staged rather than enforced.
#
# * `await-holding-invalid-types` — the type list behind
#   `await_holding_invalid_type`, which the workspace lint table denies. Without
#   the list the lint has nothing to match.
#
# * `large-error-threshold = 256` — rich error enums are deliberate here;
#   raising the threshold keeps `result_large_err` on for everything else
#   instead of allowing it workspace-wide.

allow-expect-in-tests = true
allow-unwrap-in-tests = true
await-holding-invalid-types = [
    "tokio::sync::MutexGuard",
    "tokio::sync::RwLockReadGuard",
    "tokio::sync::RwLockWriteGuard",
]

large-error-threshold = 256
