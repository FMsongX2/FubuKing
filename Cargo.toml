# Modified by FubuKing from upstream Atlas (Apache-2.0).
# FubuKing's cargo workspace: the `fubuking` CLI and the Atlas crates it is
# built on. Cargo honours profiles only in the manifest it was invoked on,
# which in a workspace is always this one, so they live here.

[workspace]
resolver = "2"

members = [
  "crates/atlas-agent-transcript",
  "crates/atlas-agent-wire",
  "crates/atlas-bus",
  "crates/atlas-checkpoint",
  "crates/atlas-embed",
  "crates/atlas-memory",
  "crates/atlas-process",
  "crates/atlas-redact",
  "crates/atlas-shared-memory",
  "crates/fubuking",
]

[workspace.dependencies]
anyhow = "1"
chrono = "0.4.43"
clap = "4"
dirs = "6"
dunce = "1.0.4"
rmcp = { version = "=3.0.0", default-features = false }
serde = { version = "1", features = ["rc"] }
serde_json = "1"
tempfile = "3.23.0"
tokio = "1"
toml = "0.9.5"
which = "8"

[workspace.lints]

# `unexpected_cfgs` is a deny because its warning form already cost a live
# failure: #54 deleted the `ported-engine` feature, four blocks stayed behind
# `#[cfg(feature = "ported-engine")]`, and a cfg on a feature that no longer
# exists compiles to NOTHING — the token-source registration vanished and the
# first real gateway turn went out with no Authorization header. Cargo warned;
# nobody greps warnings. Now it fails the build.
rust = { unexpected_cfgs = "deny" }

[workspace.lints.clippy]

# `unwrap_used` and `expect_used` are STAGED, not enforced: turning the table
# on for the first-party members (#60) surfaced ~220 violations of the pair,
# overwhelmingly in test code where a panic IS the failure report. Re-add them
# behind a cleanup pass rather than allowlisting two hundred call sites in one
# sweep. Every other deny below is live and clean.
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"

# The profile the published CLI binaries are built with. Thin LTO, not fat:
# fat LTO's final link is one long single-threaded step that reruns on every
# rebuild, for a slightly smaller binary. Measure before switching.
[profile.release]
codegen-units = 1   # Single codegen unit → better cross-function inlining
lto = "thin"        # Cross-crate inlining and dead-code removal, per codegen
                    # unit in parallel instead of one serial whole-program merge
strip = "symbols"   # Smaller binary
panic = "unwind"    # REQUIRED — two `catch_unwind` guards depend on it:
                    #  1. atlas-embed's EMBEDDER catches candle's Metal
                    #     kernel-compile panic (at load AND per forward) to fall
                    #     back to CPU rather than crash.
                    #  2. atlas-checkpoint wraps atlas-redact, so a redaction
                    #     panic can never leak unredacted text.
                    # `abort` would turn each of these into a crash.
opt-level = 3       # Default for release, restated for clarity

# Build scripts and proc macros run once at compile time and none of their
# code is linked into the binary, so they are compiled fast rather than
# optimised. Shipped output is bit-identical either way.
[profile.release.build-override]
opt-level = 0
codegen-units = 256

[profile.dev]
# `line-tables-only` keeps file:line in panic backtraces and profiler symbols
# and drops only variable inspection, for a much smaller target/debug. Restore
# `debug = true` locally (never commit it) to step through Rust in lldb.
debug = "line-tables-only"

# Dependencies build at `opt-level = 1` in dev, so tests that drive the
# embedder, the vector index and SQLite do not run unoptimised code. No debug
# info for them: backtraces are read in workspace members.
[profile.dev.package."*"]
opt-level = 1
debug = false

# `"*"` reaches dependencies only; cargo excludes workspace members from it,
# so each member restates the level. A new member needs a stanza here.
[profile.dev.package.atlas-agent-transcript]
opt-level = 1
[profile.dev.package.atlas-agent-wire]
opt-level = 1
[profile.dev.package.atlas-bus]
opt-level = 1
[profile.dev.package.atlas-checkpoint]
opt-level = 1
[profile.dev.package.atlas-embed]
opt-level = 1
[profile.dev.package.atlas-memory]
opt-level = 1
[profile.dev.package.atlas-process]
opt-level = 1
[profile.dev.package.atlas-redact]
opt-level = 1
[profile.dev.package.atlas-shared-memory]
opt-level = 1
[profile.dev.package.fubuking]
opt-level = 1
