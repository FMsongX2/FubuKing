# Modified by FubuKing from upstream Atlas (Apache-2.0).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
# Cancelling keeps queue times down when several PRs are in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Incremental compilation only pays off across repeated local rebuilds; a CI
  # job compiles once and throws the machine away, so it is pure overhead here.
  CARGO_INCREMENTAL: 0
  # `line-tables-only` rather than the default full debug info: most of the
  # build-time and artifact-size saving, while panics keep real file and line
  # numbers, which is the whole point of reading a failed CI log.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  crates:
    # Every crate gets its own job so a failure names the crate rather than the
    # workspace. A new workspace member needs a line here.
    #
    # `clippy: true` marks the crates that are warning-clean under
    # `-D warnings`. The rest are not yet; flip the flag as each is cleaned up
    # rather than weakening the gate for the ones that already pass.
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing crate in one run instead of stopping at the first.
      fail-fast: false
      matrix:
        include:
          - crate: atlas-agent-transcript
            clippy: true
          - crate: atlas-agent-wire
            clippy: true
          - crate: atlas-bus
          - crate: atlas-checkpoint
            clippy: true
          - crate: atlas-embed
          - crate: atlas-memory
            clippy: true
          - crate: atlas-process
          - crate: atlas-redact
            clippy: true
          - crate: atlas-shared-memory
            clippy: true
          - crate: fubuking
            clippy: true
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, not the depth-1 default: fubuking's `apache_notices`
          # test diffs the tree against the fork base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Workspace members share the root lockfile and target dir. Saved from
      # pushes only, so open pull requests do not crowd out the cache budget.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          save-if: ${{ github.event_name == 'push' }}
      # Several suites build real git repositories in a tempdir, and `git
      # commit` refuses to run without an identity. Set for every crate so
      # adding such a test to another crate doesn't fail mysteriously.
      - name: Configure git identity for test repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Test
        working-directory: crates/${{ matrix.crate }}
        run: cargo test --locked
      # Exactly one clippy pass per crate: `-D warnings` on top of the
      # workspace lint table is a strict superset of the table alone.
      - name: Clippy (-D warnings)
        if: matrix.clippy
        working-directory: crates/${{ matrix.crate }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (workspace lint table)
        if: ${{ !matrix.clippy }}
        working-directory: crates/${{ matrix.crate }}
        run: cargo clippy --locked --all-targets

  fubuking-windows:
    # The `fubuking` CLI on Windows. Its console handoff (the Windows
    # `terminal` module in `run.rs`) and the PATHEXT lookup compile only
    # here, and the process-tree kill is tested only here.
    name: fubuking (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # see the crates job
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          save-if: ${{ github.event_name == 'push' }}
      - name: Test
        working-directory: crates/fubuking
        run: cargo test --locked
      - name: Clippy (-D warnings)
        working-directory: crates/fubuking
        run: cargo clippy --locked --all-targets -- -D warnings
