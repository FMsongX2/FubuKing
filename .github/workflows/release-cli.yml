name: Release CLI

# A `v<version>` tag builds the `fubuking` CLI for macOS, Linux and Windows,
# signs a build provenance attestation for every archive (Sigstore, keyless,
# bound to this workflow: `gh attestation verify <archive> -R FMsongX2/FubuKing
# --signer-workflow FMsongX2/FubuKing/.github/workflows/release-cli.yml`)
# and publishes the archives with a SHA256SUMS file as a GitHub release.
# Started by hand, it builds and uploads the archives as run artifacts only.
#
# Archive names carry no version, so
# `releases/latest/download/fubuking-<target>.tar.gz` stays a stable link.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # The Linux builds run in manylinux_2_28 (see the build step), so the
          # runner only hosts the container.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --locked --release -p fubuking --target ${{ matrix.target }}
      # AlmaLinux 8 with glibc 2.28 and GCC 14. GCC 13 or newer is what
      # numkong, the C kernels under usearch, needs; the old glibc and the
      # toolset's libstdc++, which links its newer parts statically, are what
      # keep the binary running on glibc 2.28 systems. A build on the runner
      # itself would need the runner's glibc.
      - name: Build (manylinux_2_28)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e CARGO_INCREMENTAL \
            "quay.io/pypa/manylinux_2_28_$(uname -m)" bash -euo pipefail -c '
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              cargo build --locked --release -p fubuking --target ${{ matrix.target }}'
      # The glibc a binary needs is the newest symbol version it imports, and a
      # build environment with a newer glibc raises it without a word. Running
      # it on Debian 10 checks glibc 2.28 and its libstdc++ together.
      - name: Check it runs on glibc 2.28
        if: runner.os == 'Linux'
        run: |
          bin="target/${{ matrix.target }}/release/fubuking"
          newest() { objdump -T "$bin" | grep -o "$1_[0-9.]*" | sort -uV | tail -1; }
          echo "imports up to $(newest GLIBC) and $(newest GLIBCXX)"
          test "$(printf '%s\n' "$(newest GLIBC)" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/bin-under-test:ro" debian:10-slim /bin-under-test/fubuking --version
      - name: Check the tag names the crate's version
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'x86_64-unknown-linux-gnu'
        run: test "$(target/${{ matrix.target }}/release/fubuking --version)" = "fubuking ${GITHUB_REF_NAME#v}"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      # The licenses of every crate linked into this target's binary
      # (crates/fubuking/about.toml), fetched first so the run is offline.
      - name: Third-party licenses
        shell: bash
        run: |
          cargo fetch --locked
          cargo about generate --frozen --target ${{ matrix.target }} -m crates/fubuking/Cargo.toml \
            -c crates/fubuking/about.toml -o THIRD-PARTY-LICENSES.txt crates/fubuking/about.hbs
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          name="fubuking-${TARGET}"
          docs="LICENSE NOTICE THIRD-PARTY-LICENSES.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${TARGET}/release/fubuking.exe" $docs dist/
            (cd dist && 7z a -tzip "${name}.zip" fubuking.exe $docs > /dev/null && rm fubuking.exe $docs)
          else
            cp "target/${TARGET}/release/fubuking" $docs dist/
            tar -czf "dist/${name}.tar.gz" -C dist fubuking $docs
            (cd dist && rm fubuking $docs)
          fi
          ls -l dist
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: fubuking-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum fubuking-* > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Prebuilt \`fubuking\` CLI ${GITHUB_REF_NAME}. Pick the archive for your system, then check it before running it:

          \`\`\`sh
          gh attestation verify fubuking-<target>.tar.gz -R ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release-cli.yml
          shasum -a 256 -c SHA256SUMS --ignore-missing
          \`\`\`

          The attestation proves the archive was built by this repository's release workflow from tag ${GITHUB_REF_NAME}. The macOS binaries are not signed with an Apple Developer ID: after a browser download, clear the quarantine flag with \`xattr -d com.apple.quarantine fubuking\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "FubuKing ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
