# Modified by FubuKing from upstream Atlas (Apache-2.0).
# The oldest macOS the binaries support, for Rust and for the C and C++ code
# built into them (SQLite, the usearch vector kernels). Without it,
# x86_64-apple-darwin would fall back to rustc's older default.
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"
