[package]
name = "atlas-engine-exec-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
clatter = { workspace = true }
atlas-engine-api = { workspace = true }
atlas-engine-config = { workspace = true }
atlas-engine-http-client = { workspace = true }
atlas-engine-exec-server-protocol = { workspace = true }
atlas-engine-file-system = { workspace = true }
atlas-engine-network-proxy = { workspace = true }
atlas-engine-otel = { workspace = true }
atlas-engine-protocol = { workspace = true }
atlas-engine-sandboxing = { workspace = true }
atlas-engine-utils-absolute-path = { workspace = true }
atlas-engine-utils-home-dir = { workspace = true }
atlas-engine-utils-path-uri = { workspace = true }
atlas-engine-utils-pty = { workspace = true }
atlas-engine-utils-rustls-provider = { workspace = true }
atlas-engine-websocket-client = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
prost = "0.14.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = { workspace = true }
atlas-engine-exec-server-test-support = { workspace = true }
atlas-engine-test-binary-support = { workspace = true }
ctor = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-case = "3.3.1"
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
