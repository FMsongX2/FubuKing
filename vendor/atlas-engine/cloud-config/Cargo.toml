atlas-engine-config = { workspace = true }
atlas-engine-http-client = { workspace = true }
atlas-engine-core = { workspace = true }
atlas-engine-login = { workspace = true }
atlas-engine-otel = { workspace = true }
atlas-engine-protocol = { workspace = true }
hmac = "0.12.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
atlas-engine-agent-identity = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lib]
doctest = false
