# Modified by Atlas from upstream OpenAI Codex (Apache-2.0). See CONTEXT.md.
[package]
edition.workspace = true
license.workspace = true
name = "atlas-engine-models-manager"
version.workspace = true

[lib]
doctest = false
name = "atlas_engine_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
atlas-engine-collaboration-mode-templates = { workspace = true }
atlas-engine-http-client = { workspace = true }
atlas-engine-login = { workspace = true }
atlas-engine-otel = { workspace = true }
atlas-engine-protocol = { workspace = true }
atlas-engine-utils-output-truncation = { workspace = true }
atlas-engine-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
