# Modified by Atlas from upstream OpenAI Codex (Apache-2.0). See CONTEXT.md.
[package]
edition.workspace = true
license.workspace = true
name = "atlas-engine-hooks"
version.workspace = true

[lib]
doctest = false
name = "atlas_engine_hooks"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
atlas-engine-config = { workspace = true }
atlas-engine-plugin = { workspace = true }
atlas-engine-protocol = { workspace = true }
atlas-engine-utils-absolute-path = { workspace = true }
atlas-engine-utils-output-truncation = { workspace = true }
futures = { workspace = true, features = ["alloc"] }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(any(unix, windows))'.dependencies]
atlas-engine-utils-pty = { workspace = true }
